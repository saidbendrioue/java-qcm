<aside
  id="primary-nav"
  class="fixed inset-y-0 left-0 z-30 hidden w-60 flex-col bg-nav px-4 py-6 text-nav-ink transition-transform duration-200 md:flex"
  [class.-translate-x-full]="!shell.desktopNavOpen()"
  [attr.inert]="shell.desktopNavOpen() ? null : ''"
>
  <p class="px-3 font-serif text-3xl leading-none">Java QCM</p>
  <p class="mt-2 px-3 text-sm text-nav-ink/70">{{ language.text('nav.tagline') }}</p>
  <nav class="mt-8 flex-1" [attr.aria-label]="language.text('nav.primary')">
    <ul class="grid gap-1">
      @for (item of items; track item.path) {
        <li>
          <a
            class="block rounded-xl px-3 py-2 text-sm font-semibold text-nav-ink/80"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
          >
            {{ navLabel(item.path) }}
          </a>
        </li>
      }
    </ul>
  </nav>
  <p class="px-3 text-xs text-nav-ink/70">{{ language.text('nav.questionsPass', { count: questions.questions().length }) }}</p>
</aside>
<nav class="fixed inset-x-0 bottom-0 z-30 border-t border-white/10 bg-nav text-nav-ink md:hidden" [attr.aria-label]="language.text('nav.primary')">
  <ul class="grid grid-cols-5 pb-[env(safe-area-inset-bottom)]">
    @for (item of items; track item.path) {
      <li>
        <a
          class="flex min-h-14 items-center justify-center px-1 py-2 text-center text-[11px] font-semibold text-nav-ink/75"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          {{ navLabel(item.path, true) }}
        </a>
      </li>
    }
  </ul>
</nav>
