<aside
  id="primary-nav"
  class="fixed inset-y-0 left-0 z-30 hidden w-60 flex-col border-r border-white/8 bg-nav px-3 py-5 text-nav-ink transition-transform duration-200 md:flex"
  [class.-translate-x-full]="!shell.desktopNavOpen()"
  [attr.inert]="shell.desktopNavOpen() ? null : ''"
>
  <div class="px-3">
    <p class="text-base font-medium leading-none">Java QCM</p>
    <p class="mt-2 text-[13px] text-nav-ink/55">{{ language.text('nav.tagline') }}</p>
  </div>
  <nav class="mt-6 flex-1" [attr.aria-label]="language.text('nav.primary')">
    <ul class="grid gap-1">
      @for (item of items; track item.path) {
        <li>
          <a
            class="block rounded-[8px] px-3 py-2 text-[14px] font-medium text-nav-ink/70 transition-colors duration-150 hover:bg-white/5 hover:text-nav-ink"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
          >
            {{ navLabel(item.path) }}
          </a>
        </li>
      }
    </ul>
  </nav>
  <p class="px-3 font-mono text-[12px] text-nav-ink/45">
    {{ language.text('nav.questionsPass', { count: questions.questions().length }) }}
  </p>
</aside>
<nav class="fixed inset-x-0 bottom-0 z-30 border-t border-white/10 bg-nav text-nav-ink md:hidden" [attr.aria-label]="language.text('nav.primary')">
  <ul class="grid grid-cols-6 pb-[env(safe-area-inset-bottom)]">
    @for (item of items; track item.path) {
      <li>
        <a
          class="flex min-h-14 items-center justify-center px-1 py-2 text-center text-[11px] font-medium text-nav-ink/70 transition-colors duration-150"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
        >
          {{ navLabel(item.path, true) }}
        </a>
      </li>
    }
  </ul>
</nav>
