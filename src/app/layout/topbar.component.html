<header
  class="sticky top-0 z-20 flex flex-wrap items-center justify-between gap-3 border-b border-line bg-canvas/85 px-4 py-3 shadow-[inset_0_1px_0_rgba(255,255,255,0.08)] backdrop-blur-md md:px-8"
>
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      class="btn btn-ghost hidden size-11 shrink-0 p-0 md:inline-flex"
      [attr.aria-expanded]="shell.desktopNavOpen()"
      aria-controls="primary-nav"
      [attr.aria-label]="language.text(shell.desktopNavOpen() ? 'nav.hide' : 'nav.show')"
      (click)="shell.toggleDesktopNav()"
    >
      <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        @if (shell.desktopNavOpen()) {
          <path d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
    <h1 class="truncate text-xl font-semibold tracking-tight md:text-2xl">{{ pageTitle() }}</h1>
  </div>
  <div class="flex flex-wrap items-center gap-2">
    @if (progress.activeExam()) {
      <a class="btn btn-primary" routerLink="/exam/session">{{ language.text('nav.resume', { time: timeLeft() ?? '' }) }}</a>
    }
    <button
      type="button"
      class="btn btn-ghost"
      [attr.aria-pressed]="theme.theme() === 'dark'"
      (click)="theme.toggle()"
    >
      {{ language.text(theme.theme() === 'dark' ? 'theme.light' : 'theme.dark') }}
    </button>
    <label class="sr-only" for="lang-select">{{ language.text('language.label') }}</label>
    <select
      id="lang-select"
      class="btn btn-ghost appearance-none pr-8"
      [attr.aria-label]="language.text('language.label')"
      [value]="language.lang()"
      (change)="onLanguage($event)"
    >
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
  </div>
</header>
